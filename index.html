<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Điểm danh – bản học</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f5f7fa; }
    .the { background: #fff; border-radius: 12px; padding: 20px; max-width: 480px; margin: auto;
           box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    h1 { font-size: 20px; color: #1a56db; margin-top: 0; }
  </style>
</head>
<body>
  <div class="the">
    <h1>Xin chào Phân hiệu!</h1>
    <p>Đây là bản học app điểm danh, chạy trên GitHub Pages.</p>
    <p>Trường THCS Liêu Tú – Phân hiệu</p>
    <p id="gio"></p>
  </div>
  <script>
    document.getElementById('gio').textContent =
      'Trang mở lúc: ' + new Date().toLocaleString('vi-VN');
  </script>
</body>
</html>
